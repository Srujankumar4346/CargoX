version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cargox_db
    restart: always
    environment:
      POSTGRES_USER: cargox_user
      POSTGRES_PASSWORD: cargox_password
      POSTGRES_DB: cargox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
