services:
  db:
    image: postgres:15-alpine
    container_name: cargox_db
    restart: always
    environment:
      POSTGRES_USER: cargox_user
      POSTGRES_PASSWORD: cargox_password
      POSTGRES_DB: cargox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargox_user -d cargox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cargox_backend_image
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cargox_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cargox_user:cargox_password@db/cargox
      - SECRET_KEY=supersecretkey-change-in-production
      - ALGORITHM=HS256
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: cargox_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
