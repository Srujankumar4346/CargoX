services:
  db:
    image: mongo:6
    container_name: cargox_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: cargox_user
      MONGO_INITDB_ROOT_PASSWORD: cargox_password
      MONGO_INITDB_DATABASE: cargox
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cargox_backend_image
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cargox_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mongodb://cargox_user:cargox_password@db:27017/cargox?authSource=admin
      - SECRET_KEY=supersecretkey-change-in-production
      - ALGORITHM=HS256
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: cargox_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
