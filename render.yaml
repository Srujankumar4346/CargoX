services:
  # 1. FastAPI Backend
  - type: web
    name: cargox-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Set this to your MongoDB Atlas connection string in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12
      - key: CLERK_ISSUER_URL
        value: https://awaited-raptor-7824.clerk.accounts.dev
      - key: CLERK_JWKS_URL
        value: https://awaited-raptor-7824.clerk.accounts.dev/.well-known/jwks.json
      - key: CLERK_SECRET_KEY
        sync: false # Set manually in Render Dashboard
      - key: CARGOX_PRIMARY_ADMIN_CLERK_ID
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # 2. Customer Frontend (Static Site)
  - type: web
    name: cargox-customer-frontend
    env: static
    rootDir: customer-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      # Catch-all route to serve index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cargox-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # 3. Admin Frontend (Static Site)
  - type: web
    name: cargox-admin-frontend
    env: static
    rootDir: admin-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      # Catch-all route to serve index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cargox-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
