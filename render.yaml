services:
  # 1. PostgreSQL Database
  - type: psql
    name: cargox-db
    plan: free # Change to starter for production
    databaseName: cargox
    user: cargox_user

  # 2. FastAPI Backend
  - type: web
    name: cargox-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cargox-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # You will need to enter this manually in the Render Dashboard
      - key: PYTHON_VERSION
        value: 3.12.0 # Ensure this matches your local Python version roughly

  # 3. React Frontend
  - type: web
    name: cargox-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      # Catch-all route to serve index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cargox-backend
          envVarKey: RENDER_EXTERNAL_URL
